<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c60b1e" />
    <title>HISPANESH | اسپانیا با دانش</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #c60b1e;
            --red-dark: #a00a18;
            --red-glow: rgba(198, 11, 30, 0.35);
            --yellow: #ffc400;
            --gold: #ffd84d;
            --gold-glow: rgba(255, 196, 0, 0.25);
            --bg: #f0f2f8;
            --card: rgba(255, 255, 255, 0.72);
            --card-border: rgba(255, 255, 255, 0.35);
            --text: #0b0f1a;
            --muted: #4a5568;
            --shadow: 0 25px 80px rgba(0, 0, 0, 0.10);
            --shadow-glow: 0 20px 60px rgba(198, 11, 30, 0.18);
            --radius: 28px;
            --glass: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        body.dark {
            --bg: #070b12;
            --card: rgba(18, 26, 40, 0.78);
            --card-border: rgba(255, 255, 255, 0.06);
            --text: #f0f4ff;
            --muted: #9aaec9;
            --shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            --glass: rgba(18, 26, 40, 0.55);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Vazirmatn", "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            overflow-x: hidden;
            transition: background 0.5s, color 0.3s;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--red), var(--yellow));
            border-radius: 12px;
        }

        /* ===== LOADER ===== */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            background: #080b14;
            transition: opacity 0.9s, visibility 0.9s;
        }
        #loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--red);
            border-bottom-color: var(--yellow);
            animation: spin 0.9s linear infinite;
        }
        .loader-ring::after {
            content: "🇪🇸";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 34px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loader-text {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            letter-spacing: 8px;
            color: #fff;
            opacity: 0.7;
        }

        /* ===== FLOATING FLAGS ===== */
        .flag-float {
            position: fixed;
            z-index: 0;
            font-size: 44px;
            pointer-events: none;
            opacity: 0.30;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.08));
            animation: floatFlag 12s ease-in-out infinite alternate;
        }
        .flag-float:nth-child(1) {
            top: 8%;
            left: 2%;
            animation-delay: 0s;
        }
        .flag-float:nth-child(2) {
            top: 22%;
            right: 2%;
            animation-delay: 2s;
            font-size: 32px;
        }
        .flag-float:nth-child(3) {
            bottom: 18%;
            left: 3%;
            animation-delay: 4s;
            font-size: 38px;
        }
        .flag-float:nth-child(4) {
            bottom: 8%;
            right: 3%;
            animation-delay: 6s;
        }
        @keyframes floatFlag {
            0% {
                transform: translateY(0) rotate(-6deg) scale(1);
            }
            100% {
                transform: translateY(-40px) rotate(6deg) scale(1.08);
            }
        }

        /* ===== HEADER / GLASS NAV ===== */
        header {
            position: sticky;
            top: 16px;
            z-index: 5000;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .nav {
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 10px 28px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: var(--shadow);
            transition: background 0.4s;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            min-width: max-content;
        }
        .logo-mark {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 28px;
            background: linear-gradient(135deg, var(--red), var(--yellow));
            box-shadow: 0 8px 24px var(--red-glow);
            transition: transform 0.3s;
        }
        .logo:hover .logo-mark {
            transform: scale(1.05) rotate(-4deg);
        }
        .logo-text {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--red), var(--yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo small {
            display: block;
            font: 9px "Vazirmatn", sans-serif;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            letter-spacing: 0;
        }
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex: 1;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            opacity: 0.8;
        }
        .nav-links a:hover {
            background: var(--red);
            color: #fff;
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--red-glow);
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(8px);
            color: var(--text);
            font-size: 18px;
            transition: 0.3s;
        }
        .icon-btn:hover {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 28px var(--red-glow);
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 92vh;
            display: flex;
            align-items: center;
            position: relative;
            padding: 40px 6% 80px;
            overflow: hidden;
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(198, 11, 30, 0.15), transparent 55%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 196, 0, 0.15), transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.05), transparent 70%);
            z-index: 0;
        }
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(198, 11, 30, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(198, 11, 30, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, #000, transparent 70%);
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1450px;
            margin: 0 auto;
            width: 100%;
        }
        .hero-badge {
            display: inline-flex;
            padding: 10px 22px;
            border-radius: 100px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            font-weight: 700;
            font-size: 13px;
            color: var(--red);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .hero h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(70px, 12vw, 140px);
            line-height: 0.92;
            letter-spacing: 6px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--red), #a00a18 30%, var(--yellow) 70%, #e6a800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 20px rgba(198, 11, 30, 0.15));
        }
        .hero h2 {
            font-size: clamp(28px, 4.5vw, 52px);
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }
        .hero p {
            max-width: 700px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.9;
        }
        .hero-buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 32px;
        }
        .btn {
            border: 0;
            border-radius: 60px;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 15px;
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            transform: translateY(-5px) scale(1.02);
        }
        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--red), #7a0510);
            box-shadow: 0 12px 40px var(--red-glow);
        }
        .btn-primary:hover {
            box-shadow: 0 18px 56px var(--red-glow);
        }
        .btn-secondary {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: var(--red);
            color: #fff;
            border-color: var(--red);
        }

        /* ===== SECTION ===== */
        section {
            max-width: 1450px;
            margin: 0 auto;
            padding: 80px 30px;
            position: relative;
        }
        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }
        .eyebrow {
            display: inline-block;
            color: var(--red);
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 12px;
            text-transform: uppercase;
            background: rgba(198, 11, 30, 0.08);
            padding: 6px 20px;
            border-radius: 60px;
            margin-bottom: 12px;
        }
        .section-title h2 {
            font-family: "Playfair Display", serif;
            font-size: clamp(34px, 5vw, 56px);
            margin: 6px 0 12px;
            font-weight: 800;
        }
        .section-title p {
            max-width: 700px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 17px;
        }

        /* ===== GLASS CARDS ===== */
        .card,
        .stat,
        .team,
        .big-box,
        .comment,
        .quiz,
        .share-box {
            background: var(--card);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover,
        .stat:hover,
        .team:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: var(--shadow), 0 0 40px rgba(198, 11, 30, 0.06);
            border-color: rgba(198, 11, 30, 0.15);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .stat {
            padding: 28px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .stat::after {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), var(--yellow));
            opacity: 0.06;
            right: -50px;
            bottom: -50px;
        }
        .stat-icon {
            font-size: 34px;
            display: block;
            margin-bottom: 6px;
        }
        .stat strong {
            display: block;
            font-size: 32px;
            color: var(--red);
            font-weight: 900;
        }
        .stat span {
            color: var(--muted);
            font-size: 14px;
        }

        /* ===== CARDS GRID ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        .card {
            padding: 30px 26px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--red), var(--yellow));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s;
        }
        .card:hover::before {
            transform: scaleX(1);
        }
        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(198, 11, 30, 0.10), rgba(255, 196, 0, 0.10));
            font-size: 32px;
            margin-bottom: 18px;
            transition: 0.3s;
        }
        .card:hover .card-icon {
            transform: scale(1.08) rotate(-4deg);
        }
        .card h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* ===== CITY ===== */
        .city {
            padding: 0;
            overflow: hidden;
        }
        .city-top {
            padding: 28px 26px;
            background: linear-gradient(135deg, var(--red), #5e0610);
            color: #fff;
            position: relative;
        }
        .city-top h3 {
            font-size: 28px;
            font-weight: 800;
        }
        .city-content {
            padding: 24px 26px 28px;
        }
        .city-filter {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        .city-filter button {
            padding: 10px 22px;
            border-radius: 60px;
            border: 1px solid var(--card-border);
            background: var(--glass);
            backdrop-filter: blur(8px);
            color: var(--text);
            font-weight: 600;
            transition: 0.3s;
        }
        .city-filter button.active,
        .city-filter button:hover {
            background: linear-gradient(135deg, var(--red), #7a0510);
            color: #fff;
            border-color: var(--red);
            box-shadow: 0 8px 24px var(--red-glow);
            transform: translateY(-2px);
        }

        /* ===== TIMELINE ===== */
        .timeline {
            position: relative;
            max-width: 950px;
            margin: 0 auto;
        }
        .timeline::before {
            content: "";
            position: absolute;
            right: 20px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(var(--red), var(--yellow));
            border-radius: 8px;
        }
        .timeline-item {
            position: relative;
            padding: 0 70px 40px 0;
        }
        .timeline-dot {
            position: absolute;
            right: 6px;
            top: 6px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--yellow);
            border: 6px solid var(--red);
            box-shadow: 0 0 0 6px rgba(198, 11, 30, 0.12);
            z-index: 2;
        }
        .timeline-box {
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 26px 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
        }
        .timeline-year {
            color: var(--red);
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* ===== FOOTBALL ===== */
        .football-hero {
            padding: 48px 44px;
            border-radius: 35px;
            background: linear-gradient(135deg, #0b111f, #1b263b);
            color: #fff;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }
        .football-hero::after {
            content: "⚽";
            position: absolute;
            font-size: 200px;
            left: -20px;
            bottom: -80px;
            opacity: 0.06;
        }
        .football-hero h3 {
            font-size: 42px;
            color: var(--yellow);
            font-family: "Playfair Display", serif;
        }

        .teams {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        .team {
            text-align: center;
            padding: 28px 18px;
        }
        .team-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--red), var(--yellow));
            font-size: 38px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(198, 11, 30, 0.2);
            transition: 0.3s;
        }
        .team:hover .team-logo {
            transform: scale(1.08) rotate(-6deg);
        }
        .team h4 {
            font-size: 20px;
            font-weight: 800;
        }

        /* ===== CULTURE ===== */
        .culture-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .big-box {
            padding: 34px 32px;
        }
        .big-box h3 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .big-box p {
            color: var(--muted);
        }

        /* ===== WEATHER ===== */
        .weather-card {
            max-width: 650px;
            margin: 0 auto;
            text-align: center;
            padding: 44px 36px;
            border-radius: 35px;
            background: linear-gradient(145deg, #0e1a2b, #1d2f44);
            color: #fff;
            box-shadow: var(--shadow);
        }
        .weather-temp {
            font-size: 74px;
            font-weight: 900;
            color: var(--yellow);
        }
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 22px;
        }
        .weather-details div {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px;
            backdrop-filter: blur(8px);
        }

        /* ===== CLOCK ===== */
        .clock-box {
            text-align: center;
            padding: 56px;
            border-radius: 35px;
            background: linear-gradient(145deg, var(--red), #5e0610);
            color: #fff;
            box-shadow: 0 20px 60px var(--red-glow);
        }
        .clock {
            font-size: clamp(60px, 12vw, 110px);
            font-weight: 900;
            letter-spacing: 6px;
            direction: ltr;
            font-family: "Inter", monospace;
        }

        /* ===== QUIZ ===== */
        .quiz {
            padding: 38px 34px;
        }
        .quiz::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--red), var(--yellow));
            border-radius: 35px 35px 0 0;
        }
        .quiz-progress {
            height: 10px;
            background: rgba(127, 127, 127, 0.12);
            border-radius: 60px;
            overflow: hidden;
        }
        .quiz-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--red), var(--yellow));
            border-radius: 60px;
            transition: width 0.5s;
        }
        .quiz-option {
            text-align: right;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background: var(--glass);
            color: var(--text);
            transition: 0.25s;
            font-weight: 500;
        }
        .quiz-option:hover {
            border-color: var(--red);
            transform: translateX(-4px);
        }
        .quiz-option.correct {
            border-color: #16a34a;
            background: rgba(22, 163, 74, 0.10);
        }
        .quiz-option.wrong {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.10);
        }

        /* ===== SHARE ===== */
        .share-box {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 30px;
            align-items: center;
            padding: 38px 36px;
        }
        .qr {
            width: 200px;
            height: 200px;
            background: #fff;
            padding: 14px;
            border-radius: 20px;
            margin: 0 auto;
        }
        .qr img {
            width: 100%;
            height: 100%;
        }

        /* ===== GROUP ===== */
        .group {
            background: linear-gradient(145deg, #0d111f, #161c2e);
            color: #fff;
            border-radius: 35px;
            padding: 56px 44px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .group::after {
            content: "🇪🇸";
            position: absolute;
            font-size: 260px;
            right: -40px;
            bottom: -80px;
            opacity: 0.04;
        }
        .group h2 {
            font-family: "Playfair Display", serif;
            font-size: 48px;
            color: var(--yellow);
        }
        .leader {
            margin: 28px auto;
            padding: 24px;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .members {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .member {
            padding: 10px 22px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
        }

        /* ===== FOOTER ===== */
        footer {
            background: #080c16;
            color: #fff;
            padding: 60px 30px 30px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer-grid {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 40px;
        }
        footer h3 {
            color: var(--yellow);
            margin-bottom: 14px;
            font-size: 18px;
        }
        footer p,
        footer li {
            color: #9aaec9;
            font-size: 14px;
            line-height: 2;
        }
        footer ul {
            list-style: none;
        }
        .copyright {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 40px;
            padding-top: 28px;
            color: #5a6f8a;
            font-size: 14px;
        }

        /* ===== NOTIFICATION ===== */
        #notification {
            position: fixed;
            left: 28px;
            bottom: 28px;
            background: var(--card);
            backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 16px 26px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            transform: translateY(120px);
            opacity: 0;
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 9999;
            font-weight: 600;
        }
        #notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        #backTop {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px;
            height: 54px;
            border: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--red), #7a0510);
            color: #fff;
            font-size: 22px;
            z-index: 8000;
            display: none;
            box-shadow: 0 12px 36px var(--red-glow);
            transition: 0.3s;
        }
        #backTop:hover {
            transform: translateY(-4px) scale(1.05);
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:1050px) {
            .nav-links {
                display: none;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .cards,
            .comments {
                grid-template-columns: repeat(2, 1fr);
            }
            .teams {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media(max-width:700px) {
            .hero {
                padding: 30px 20px 60px;
                min-height: 80vh;
            }
            section {
                padding: 50px 16px;
            }
            .stats,
            .cards,
            .comments,
            .teams,
            .culture-box,
            .share-box,
            .footer-grid {
                grid-template-columns: 1fr;
            }
            .nav {
                padding: 8px 16px;
                border-radius: 40px;
            }
            .logo-text {
                font-size: 18px;
            }
            .hero h1 {
                font-size: 48px;
            }
            .football-hero,
            .group {
                padding: 28px 20px;
            }
            .share-box {
                text-align: center;
            }
            .qr {
                width: 160px;
                height: 160px;
            }
            .flag-float {
                display: none;
            }
            .clock {
                font-size: 40px;
            }
        }
    </style>
</head>
